[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asana-deck"
version = "0.1.0"
description = "Generate slide decks from Asana project boards using AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asana>=5.0.0",
    "anthropic>=0.39.0",
    "python-pptx>=1.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
asana-deck = "asana_deck.cli:main"

[tool.setuptools.packages.find]
include = ["asana_deck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
